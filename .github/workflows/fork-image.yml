# Control-plane image for the fork. fork-ci calls this after its tests pass on
# a push to the custom branch; it can also be run by hand. The version comes
# from the VERSION file, which only upstream bumps, so image tags follow the
# upstream release this branch is based on:
#   ghcr.io/<owner>/vm2api:v<VERSION>            multi-arch, moves with the branch
#   ghcr.io/<owner>/vm2api:v<VERSION>-<sha7>     multi-arch, immutable per commit
#   ghcr.io/<owner>/vm2api:custom                multi-arch, latest custom build
#   ...-amd64 / ...-arm64                        single-arch parts
name: fork-image

on:
  workflow_call:
    inputs:
      arm64:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Also build the arm64 image'
        type: boolean
        default: true

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      arm64: ${{ steps.meta.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version=$(tr -d '[:space:]' < VERSION)
          arm64="${{ inputs.arm64 }}"
          {
            echo "sha=${sha}"
            echo "image=ghcr.io/${owner}/vm2api"
            echo "version=${version}"
            echo "ref=v${version}-${sha:0:7}"
            echo "arm64=${arm64}"
          } >> "$GITHUB_OUTPUT"
          echo "### vm2api v${version} @ ${sha:0:7}" >> "$GITHUB_STEP_SUMMARY"

  image-amd64:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.ref }}-amd64
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=fork-vm2api
          cache-to: type=gha,scope=fork-vm2api,mode=max

  image-arm64:
    needs: meta
    if: needs.meta.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: prepare pinned x86 QEMU handler
        run: |
          python3 deploy/prepare-arm64.py
          python3 deploy/prepare-arm64.py --check
      - name: build native control plane
        run: >-
          docker build --progress=plain --platform linux/arm64
          -f deploy/Dockerfile.arm64-control
          --label org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          --label org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
          -t "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.ref }}-arm64" .
      - name: verify native runtime and emulated payloads
        run: python3 test/deploy/smoke_arm64_image.py "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.ref }}-arm64"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.ref }}-arm64"

  manifest:
    needs: [meta, image-amd64, image-arm64]
    # Runs with amd64 alone when arm64 was skipped from a manual run.
    if: >-
      always() && needs.image-amd64.result == 'success' &&
      (needs.image-arm64.result == 'success' || needs.image-arm64.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.meta.outputs.image }}"
          ref="${{ needs.meta.outputs.ref }}"
          version="v${{ needs.meta.outputs.version }}"
          sources=("${image}:${ref}-amd64")
          if [ "${{ needs.image-arm64.result }}" = "success" ]; then sources+=("${image}:${ref}-arm64"); fi
          docker buildx imagetools create \
            -t "${image}:${ref}" -t "${image}:${version}" -t "${image}:custom" \
            "${sources[@]}"
          docker buildx imagetools inspect "${image}:${ref}"
          {
            echo ""
            echo "- \`${image}:${ref}\`"
            echo "- \`${image}:${version}\`"
            echo "- \`${image}:custom\`"
          } >> "$GITHUB_STEP_SUMMARY"
